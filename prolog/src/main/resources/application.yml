spring:
  datasource:
    url: ${PROLOG_DB_URL:jdbc:postgresql://localhost:5432/prolog}
    username: ${PROLOG_DB_USERNAME:postgres}
    password: ${PROLOG_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${PROLOG_DB_MAX_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    default-schema: public
    schemas: public
    create-schemas: true
server:
  servlet:
    context-path: /

prolog:
  jwt:
    secret: ${PROLOG_JWT_SECRET:change-me-change-me-change-me-change-me}
    issuer: ${PROLOG_JWT_ISSUER:prolog-agentteam}
  langflow:
    base-url: ${LANGFLOW_BASE_URL:}
    api-key: ${LANGFLOW_API_KEY:}
  evolution:
    clustering-flow-id: ${PROLOG_CLUSTERING_FLOW_ID:request-log-clustering}
    rule-generation-flow-id: ${PROLOG_RULE_GENERATION_FLOW_ID:rule-generation}
    sample-limit: ${PROLOG_CLUSTERING_SAMPLE_LIMIT:100}
    clustering:
      enabled: ${PROLOG_CLUSTERING_ENABLED:false}
      cron: ${PROLOG_CLUSTERING_CRON:0 0 3 * * ?}
